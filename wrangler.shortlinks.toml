# Dedicated resolver for aot.im/s/*, in front of the independent apex site.
name = "aot-shortlinks"
main = "./worker/shortlinks.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "aot.im/s/*", zone_name = "aot.im" }]

[[d1_databases]]
binding = "DB"
database_name = "subweb-shortlinks"
database_id = "855b2ba6-7fe1-4bbb-a833-a81f0f4b9ada"
